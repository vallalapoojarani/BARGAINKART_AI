{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 80px 20px; max-width: 600px; margin: 40px auto;">
    <div style="font-size: 4rem; font-weight: 800; color: #f43f5e; font-family: 'Space Grotesk', sans-serif;">500</div>
    <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 12px;">Internal Server Error</h2>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px;">
        An unexpected condition was encountered. Please try refreshing or return to the dashboard.
    </p>
    <a href="{{ url_for('products.landing') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
