{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 80px 20px; max-width: 600px; margin: 40px auto;">
    <div style="font-size: 4rem; font-weight: 800; color: #6366f1; font-family: 'Space Grotesk', sans-serif;">404</div>
    <h2 style="font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 12px;">Page Not Found</h2>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px;">
        The requested resource or catalog listing does not exist or may have been relocated.
    </p>
    <a href="{{ url_for('products.landing') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
