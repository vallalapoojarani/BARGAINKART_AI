{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 40px auto;">
    <div class="card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 50px; height: 50px; border-radius: var(--radius-md); background: var(--primary-gradient); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; margin-bottom: 14px; box-shadow: var(--shadow-glow);">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: #fff; font-family: 'Space Grotesk', sans-serif;">Welcome Back</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Sign in to access your AI negotiations, cart, and dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Email Address or Student Roll Number</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-id-card" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.88rem;"></i>
                    <input type="text" name="email" id="loginEmail" required placeholder="Roll No (e.g. 23568T3055) or email" 
                           style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px 11px 40px; color: #fff; font-size: 0.9rem; outline: none;">
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="font-size: 0.8rem; font-weight: 600; color: #e2e8f0;">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.75rem; color: var(--accent-teal); text-decoration: none;">Forgot password?</a>
                </div>
                <div style="position: relative;">
                    <i class="fa-solid fa-key" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.88rem;"></i>
                    <input type="password" name="password" id="loginPassword" required placeholder="••••••••" 
                           style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px 11px 40px; color: #fff; font-size: 0.9rem; outline: none;">
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
                <input type="checkbox" name="remember" id="rememberMe" style="accent-color: var(--primary);">
                <label for="rememberMe" style="font-size: 0.82rem; color: var(--text-secondary); cursor: pointer;">Remember this session</label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <!-- Quick Demo Accounts Fill for College Presentation -->
        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <div style="font-size: 0.72rem; text-transform: uppercase; font-weight: 800; color: #34d399; text-align: center; margin-bottom: 6px; letter-spacing: 0.5px;">
                <i class="fa-solid fa-graduation-cap"></i> UCETW Team 10 & Guide Credentials (1-Click Fill)
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.74rem; background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: #34d399; grid-column: span 2;" onclick="fillDemo('smt.p.vaishnavi', 'vaishnavi')">
                    <i class="fa-solid fa-chalkboard-user"></i> Guide: Smt. P. Vaishnavi (vaishnavi)
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem;" onclick="fillDemo('23568T3055', 'poojarani')">
                    <i class="fa-solid fa-user-graduate"></i> V. Poojarani (3055)
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem;" onclick="fillDemo('245683064L', 'anusha')">
                    <i class="fa-solid fa-user-graduate"></i> P. Anusha (245683064L)
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem;" onclick="fillDemo('23568T3018', 'deepika')">
                    <i class="fa-solid fa-user-graduate"></i> G. Deepika (3018)
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem;" onclick="fillDemo('23568T3012', 'pavani')">
                    <i class="fa-solid fa-user-graduate"></i> D. Pavani (3012)
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem; grid-column: span 2;" onclick="fillDemo('23568T3029', 'prathyusha')">
                    <i class="fa-solid fa-user-graduate"></i> K. Prathyusha (3029)
                </button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem;" onclick="fillDemo('demo@bargainkart.com', 'Demo@123')">
                    <i class="fa-solid fa-user"></i> Demo Customer
                </button>
                <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.72rem;" onclick="fillDemo('admin@bargainkart.com', 'Admin@123')">
                    <i class="fa-solid fa-shield-halved text-amber-400"></i> Admin
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one now</a>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pass) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pass;
}
</script>
{% endblock %}
