{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 50px auto;">
    <div class="card" style="padding: 36px 30px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 50px; height: 50px; border-radius: var(--radius-md); background: rgba(6, 182, 212, 0.15); color: #22d3ee; display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 14px;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 800; color: #fff; font-family: 'Space Grotesk', sans-serif;">Recover Password</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Enter your registered email address to receive password recovery instructions</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div style="margin-bottom: 22px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Email Address</label>
                <input type="email" name="email" required placeholder="name@domain.com" 
                       style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px; color: #fff; font-size: 0.9rem; outline: none;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <i class="fa-solid fa-paper-plane"></i> Send Recovery Link
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px;">
            <a href="{{ url_for('auth.login') }}" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
