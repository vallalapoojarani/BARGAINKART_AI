{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 30px auto;">
    <div class="card" style="padding: 36px 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 50px; height: 50px; border-radius: var(--radius-md); background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; margin-bottom: 14px;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 style="font-size: 1.6rem; font-weight: 800; color: #fff; font-family: 'Space Grotesk', sans-serif;">Create Your Account</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Join BARGAINKART to verify authentic products and negotiate savings</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" 
                       style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px; color: #fff; font-size: 0.9rem; outline: none;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Email Address</label>
                <input type="email" name="email" required placeholder="john@example.com" 
                       style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px; color: #fff; font-size: 0.9rem; outline: none;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Password</label>
                <input type="password" name="password" required placeholder="Create a strong password" 
                       style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px; color: #fff; font-size: 0.9rem; outline: none;">
            </div>

            <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Phone Number</label>
                <input type="text" name="phone" placeholder="+91 98765 43210" 
                       style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px; color: #fff; font-size: 0.9rem; outline: none;">
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; margin-bottom: 6px;">Default Shipping Address</label>
                <textarea name="address" rows="2" placeholder="Street, City, State, PIN" 
                          style="width: 100%; background: #0f172a; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 11px 14px; color: #fff; font-size: 0.9rem; outline: none;"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem;">
                <i class="fa-solid fa-user-check"></i> Complete Registration
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
